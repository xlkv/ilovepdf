<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iLovePDF Visual Editor - Mini App</title>
  <!-- Telegram Web App JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- PDF.js for rendering PDF pages in browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- SortableJS for smooth drag-and-drop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <!-- pdf-lib for client-side PDF modification -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">📄</span>
        <h2>iLovePDF Visual Editor</h2>
      </div>
      <p class="subtitle">Drag & Drop page organizer for xlkv.uz</p>
    </header>

    <main class="main-content">
      <!-- File Upload Zone -->
      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-content">
          <div class="upload-icon">📥</div>
          <h3>PDF Faylni shu yerga tashlang</h3>
          <p>yoki faylni tanlash uchun bosing</p>
          <input type="file" id="file-input" accept="application/pdf" hidden>
          <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">📁 Faylni Tanlash</button>
        </div>
      </div>

      <!-- Editor Canvas Grid (Hidden initially) -->
      <div id="editor-section" class="editor-section hidden">
        <div class="toolbar">
          <div class="info-badge">
            <span id="page-count-badge">0 Sahifa</span>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-secondary btn-sm" id="btn-rotate-all">🔄 Barchasini 90° Burish</button>
            <button class="btn btn-danger btn-sm" id="btn-reset">🗑 Qayta Yuklash</button>
          </div>
        </div>

        <div id="pages-grid" class="pages-grid"></div>

        <div class="export-bar">
          <button class="btn btn-success btn-lg" id="btn-export">🚀 Qayta Ishlangan PDF ni Saqlash</button>
        </div>
      </div>
    </main>

    <!-- Loading Indicator Modal -->
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p id="loading-text">PDF Sahifalari yuklanmoqda...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
